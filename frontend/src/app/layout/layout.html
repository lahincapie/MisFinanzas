<div class="layout">
  <aside class="sidebar">
    <div class="brand">
      <h1 class="brand-name">MisFinanzas</h1>
      <p class="brand-tag">Tu mes, bajo control</p>
    </div>

    <div class="user">
      <div class="avatar">{{ (userEmail || '?').charAt(0).toUpperCase() }}</div>
      <span class="user-email">{{ userEmail }}</span>
    </div>

    <nav class="nav">
      <a routerLink="/dashboard" routerLinkActive="active" class="nav-link">
        <mat-icon>dashboard</mat-icon> Dashboard
      </a>
      <p class="nav-section">Gestionar</p>
      <a routerLink="/categories" routerLinkActive="active" class="nav-link">
        <mat-icon>label</mat-icon> Categorías
      </a>
      <a routerLink="/expenses" routerLinkActive="active" class="nav-link">
        <mat-icon>payments</mat-icon> Gastos
      </a>
      <a routerLink="/incomes" routerLinkActive="active" class="nav-link">
        <mat-icon>savings</mat-icon> Ingresos
      </a>
    </nav>

    <button class="logout" (click)="logout()">
      <mat-icon>logout</mat-icon> Cerrar sesión
    </button>
  </aside>

  <main class="content">
    <router-outlet />
  </main>
</div>
